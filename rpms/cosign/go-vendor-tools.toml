    [
        "cp", "-p",
        "vendor/github.com/alibabacloud-go/cr-20181201/LICENSE",
        "vendor/github.com/alibabacloud-go/cr-20160607/LICENSE",
    ],
]

[archive.dependency_overrides]
# CVE-2026-116591
"github.com/klauspost/compress" = "v1.20.2"

