rpm-macros:
  command: |
    TEST_IMAGE="quay.io/hummingbird/core-runtime:latest-builder"

    # Create a container with a command that keeps it running
    container_id=$("${TEST_ENGINE:?}" create --entrypoint sleep "${TEST_IMAGE}" infinity)

    # Ensure cleanup on exit
    cleanup() {
      "${TEST_ENGINE}" rm -f "${container_id}" 2>/dev/null || true
    }
    trap cleanup EXIT

    # Copy RPM into container
    "${TEST_ENGINE}" cp "${TEST_RPM:?}" "${container_id}:/tmp/test.rpm"

    # Start the container
    "${TEST_ENGINE}" start "${container_id}"

    # Install the test RPM
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" dnf install -y /tmp/test.rpm

    # Verify macros
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" rpm --eval "%{_bindir}"
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" rpm --eval "%{_libdir}"
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" rpm --eval "%{_sysconfdir}"
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" rpm --showrc

    # Cleanup
    "${TEST_ENGINE}" stop "${container_id}"
    "${TEST_ENGINE}" rm -f "${container_id}"

rpm-install-package:
  command: |
    TEST_IMAGE="quay.io/hummingbird/core-runtime:latest-builder"

    # Create a container with a command that keeps it running
    container_id=$("${TEST_ENGINE:?}" create --entrypoint sleep "${TEST_IMAGE}" infinity)

    # Ensure cleanup on exit
    cleanup() {
      "${TEST_ENGINE}" rm -f "${container_id}" 2>/dev/null || true
    }
    trap cleanup EXIT

    # Copy RPM into container
    "${TEST_ENGINE}" cp "${TEST_RPM:?}" "${container_id}:/tmp/test.rpm"

    # Start the container
    "${TEST_ENGINE}" start "${container_id}"

    # Install the test RPM
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" dnf install -y /tmp/test.rpm

    # Download package
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" dnf download which

    # Install package
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" rpm -ivh which-*.rpm

    # Verify installation
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" which --version

    # Cleanup
    "${TEST_ENGINE}" stop "${container_id}"
    "${TEST_ENGINE}" rm -f "${container_id}"
