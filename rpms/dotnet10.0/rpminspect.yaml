---
inspections:
    # We patch upstream a lot, no need to reject patches
    patches: off
annocheck:
    extra_opts:
        # See https://sourceware.org/annobin/annobin.html/The-tests.html
        # Disable/skip these checks:
        #  --skip-cf-protection: upstream doesn't build with -fcf-protection;
        #    https://github.com/dotnet/runtime/issues/40100
        #  --skip-dynamic-tags: the spec disables -mbranch-protection=standard
        #    because it breaks CoreCLR unwinding through libunwind
        #  --skip-fortify: NativeAOT bootstrapper objects report MAYB because
        #    the required compiler option isn't recorded
        #  --skip-glibcxx-assertions: NativeAOT bootstrapper objects report MAYB
        #    because the required compiler option isn't recorded
        #  --skip-lto: upstream binaries don't record whether LTO was used, so
        #    annocheck reports MAYB
        #  --skip-optimization, --skip-stack-clash, --skip-stack-prot:
        #    some upstream Clang/LLVM binaries lack the annobin notes needed by
        #    these Fedora-profile checks, so they report MAYB
        #  --skip-pic: packaged relocatable object files aren't final PIC binaries
        #  --skip-property-note: some apphost binaries lack GNU property notes
        #  --skip-warnings: NativeAOT bootstrapper objects report MAYB because
        #    the compiler warning option isn't recorded
        - hardened: --skip-cf-protection --skip-dynamic-tags --skip-fortify --skip-glibcxx-assertions --skip-lto --skip-optimization --skip-pic --skip-property-note --skip-stack-clash --skip-stack-prot --skip-warnings

badfuncs:
    allowed:
        # The Mono runtime (used on s390x, for example), uses inet_addr for
        # debugging (such as sending the control flow graph to a remote process).
        # See runtime/src/mono/mono/mini/cfgdump.c. This isn't part of any
        # standard networking facility; networking APIs are implemented/used in
        # libSystem*so.
        /usr/lib64/dotnet/shared/Microsoft.NETCore.App/*/libcoreclr.so:
            - inet_addr
        /usr/lib64/dotnet/packs/Microsoft.NETCore.App.Runtime.*/*/runtimes/*/native/libcoreclr.so:
            - inet_addr
runpath:
    # Upstream explicitly sets $ORIGIN/netcoredeps as an RPATH
    # See https://github.com/dotnet/core/blob/main/Documentation/self-contained-linux-apps.md
    allowed_origin_paths:
        - /netcoredeps
