[archive]
post_commands = [
  # go-localereader declares MIT in README.md but ships no LICENSE file
  ["cp", "-p", "vendor/github.com/mattn/go-localereader/README.md", "vendor/github.com/mattn/go-localereader/LICENSE"],
  # dennwc/ioctl has LICENSE on master branch but go mod vendor doesn't include it
  ["curl", "-fSL", "-o", "vendor/github.com/dennwc/ioctl/LICENSE", "https://raw.githubusercontent.com/dennwc/ioctl/master/LICENSE"],
]

[licensing]
detector = "askalono"
exclude_files = [
  "vendor/github.com/efficientgo/core/COPYRIGHT",
  # infinityworks/go-common repo deleted from GitHub; module ships no LICENSE file
  "vendor/github.com/infinityworks/go-common",
]

