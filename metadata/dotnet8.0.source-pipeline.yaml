# Keep GitHub's archive bytes intact for Microsoft's signature verification.
fetch:
  - type: url
    url: "https://github.com/dotnet/dotnet/archive/refs/tags/v${VERSION}.tar.gz"
    filename: "dotnet-${VERSION}.tar.gz"
  - type: url
    url: "https://github.com/dotnet/dotnet/releases/download/v${VERSION}/dotnet-${VERSION}.tar.gz.sig"
  - type: url
    url: "https://github.com/dotnet/dotnet/releases/download/v${VERSION}/release.json"

verify:
  - type: gpg-signature
    target: "dotnet-${VERSION}.tar.gz"
    signature: "dotnet-${VERSION}.tar.gz.sig"
    keyring: "dotnet.gpg"

# The runtime and ASP.NET Core versions come from the release manifest.
# .NET 8 also has a separate host_version macro.
post:
  - type: run
    artifacts: ["release.json"]
    command:
      - "bash"
      - "-c"
      - |
        set -euo pipefail
        runtime_version="$(jq -er .runtimeVersion release.json)"
        aspnetcore_version="$(jq -er .aspNetCoreVersion release.json)"
        # Use the emitted filename so the updater can find Source0 for patch checks.
        sed -i -E \
          -e 's|^Source0:[[:blank:]]+https://github.com/dotnet/dotnet/archive/.*|Source0:        dotnet-%{sdk_version}.tar.gz|' \
          -e 's|^%global upstream_tag .*|%global upstream_tag v${VERSION}|' \
          -e 's|^%global sdk_version .*|%global sdk_version ${VERSION}|' \
          -e "s@^(%global (host_version|runtime_version)) .*@\1 $runtime_version@" \
          -e "s|^%global aspnetcore_runtime_version .*|%global aspnetcore_runtime_version $aspnetcore_version|" \
          "${SPEC_FILE}"
        if [ "${VERSION}" != "${OLD_VERSION}" ]; then
          sed -i -E 's|^Release:.*|Release:        0.1%{?dist}|' "${SPEC_FILE}"
        fi

# release.json stays in git; only the archive and signature enter the cache.
publish:
  files: ["dotnet-${VERSION}.tar.gz", "dotnet-${VERSION}.tar.gz.sig"]
