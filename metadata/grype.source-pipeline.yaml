    reason: "HUM-11270: Source0 go.mod/go.sum security pins synced for klauspost/compress v1.20.2 (CVE-2026-116591); remaining source files unchanged from v0.121.0."
  - file: "grype-0.121.0-vendor.tar.bz2"
