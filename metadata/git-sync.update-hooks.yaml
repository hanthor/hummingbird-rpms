# Download source tarball and generate Go vendor tarball.
download_sources: |
  set -euo pipefail
  version="${UPDATE_NEW_VERSION}"
  cd "${UPDATE_PACKAGE_DIR}"

  curl -fSL -o "git-sync-${version}.tar.gz" \
    "https://github.com/kubernetes/git-sync/archive/v${version}/git-sync-${version}.tar.gz" >&2

  tar xf "git-sync-${version}.tar.gz" >&2

  go_vendor_archive create \
    --config go-vendor-tools.toml \
    -O "git-sync-${version}-vendor.tar.bz2" \
    "git-sync-${version}" >&2

  rm -rf "git-sync-${version}"

  echo "git-sync-${version}.tar.gz"
  echo "git-sync-${version}-vendor.tar.bz2"
