# fontconfig's Source0 pointed at freedesktop.org's release mirror, but
# 2.17.1 was never published there -- the real directory listing only goes
# up to 2.16.0 (confirmed live). fontconfig kept both autotools and meson
# build files side by side during its build-system transition; this spec
# only uses %meson/%meson_build/%meson_install (-Ddoc=disabled), so a plain
# git checkout at the release tag has everything the build actually needs.
# The files an official autotools `make dist` tarball would have included
# (generated configure/Makefile.in, ~250 generated man pages under doc/)
# are irrelevant here -- confirmed by diffing a git checkout of the last
# tag that *did* get a real dist tarball (2.16.0) against that tarball:
# the only differences are exactly those autotools/doc-generation
# artifacts, nothing meson-relevant.
fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "${VERSION}"
    archive_name: "fontconfig-${VERSION}.tar.xz"

accepted-checksums:
  - file: "fontconfig-2.17.1.tar.xz"
    checksum: "01fec6019addf747de65b051cc377b74e30983b930521052c08d108683f5a88c8ce16f2bb2c7ff4b2244baab239ffb0004ff2b942ff68d6b4a45cb7091fac4ac"
    reason: >-
      One-time transition: 2.17.1 was never published as an official dist
      tarball (freedesktop.org's release mirror stops at 2.16.0), so the
      previously recorded checksum was almost certainly sourced from
      GitLab's own auto-generated tag archive by whoever last updated this
      package -- now generated by gorget's own git fetch (git archive +
      xz, mtime pinned to the commit timestamp) instead. Content verified
      structurally equivalent (same file set as a plain git checkout at
      the same tag); the build doesn't depend on any of the
      autotools/doc-generation-time files a real dist tarball would add
      (doc generation is disabled: -Ddoc=disabled).
