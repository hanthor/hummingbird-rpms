update_spec: |
  version="${UPDATE_NEW_VERSION}"
  if [[ ! "${version}" =~ ^11(\.[0-9]+)+\+([0-9]+)$ ]]; then
    echo "Unsupported Temurin 11 version: ${UPDATE_NEW_VERSION}" >&2
    exit 1
  fi
  build="${BASH_REMATCH[2]}"
  base="${version%%+*}"
  archive_version="${base}_${build}"
  rpm_version="${base}.0.0.$((10#${build}))"
  url_version="${base}%%2B${build}"
  sed -Ei \
    -e 's|^(%global upstream_version ).*|\1'"${version}"'|' \
    -e 's|^(%global upstream_version_url ).*|\1'"${url_version}"'|' \
    -e 's|^(%global archive_version ).*|\1'"${archive_version}"'|' \
    -e 's|^(Version:[[:space:]]+).*|\1'"${rpm_version}"'|' \
    -e 's|^(Release:[[:space:]]+).*|\10.1%{?dist}|' \
    "${UPDATE_SPEC_FILE}"
