fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "v${VERSION}"
    archive_name: "${PACKAGE}-${VERSION}.tar.gz"
transform:
  - type: vendor
    ecosystem: cargo
    archive_name: "${PACKAGE}-${VERSION}-vendor.tar.xz"
policy:
  vendor-constraints:
    - package: russh
      ecosystem: cargo
      version: "0.65.0"
      reason: "CVE-2026-116696, CVE-2026-116773"
