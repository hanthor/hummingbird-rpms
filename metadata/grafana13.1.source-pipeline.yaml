fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "v${VERSION}"
    archive_name: "grafana-${VERSION}.tar.gz"

transform:
  # Pinned ahead of the `vendor` step below (Fetch's own `vendor` step always
  # runs before Transform and can't order a pin before it): CVE-2026-61709,
  # fixed upstream in openfga 1.18.1. Grafana 13.1.6 (latest on the 13.1
  # branch) still requires 1.18.0. Mirrored by grafana-openfga-cve.patch's
  # go.mod/go.sum edit to Source0 -- see that patch's spec comment.
  - type: vendor-pin
    ecosystem: go
    pins:
      - dependency: "github.com/openfga/openfga"
        minimum_version: "1.18.1"
  - type: vendor
    ecosystem: go
    archive_name: "grafana-${VERSION}-vendor.tar.bz2"
  - type: run
    path: "."
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        if [ -n "${HTTP_PROXY-}" ]; then export YARN_HTTP_PROXY="${HTTP_PROXY-}"; fi
        if [ -n "${HTTPS_PROXY-}" ]; then export YARN_HTTPS_PROXY="${HTTPS_PROXY-}"; fi
        # Apply the complete frontend patch sequence and generate this
        # release's compression patch before creating the offline cache.
        bash "${PACKAGE_DIR}/prepare-yarn-cache-source.sh" \
          . "${VERSION}" --generate-compression
        # Unlike grafana12.4, 13.1's yarn.lock has no Cypress dependency to
        # suppress a binary download for.
        # YARN_NPM_MINIMAL_AGE_GATE=0: qs 6.16.0 is newer than the 3-day gate
        # in .yarnrc.yml (needed until 2026-09-04).
        YARN_ENABLE_GLOBAL_CACHE=false YARN_CACHE_FOLDER=.yarn/cache \
          YARN_NPM_MINIMAL_AGE_GATE=0 \
          node .yarn/releases/yarn-*.cjs install --immutable
        # Deterministic flags: yarn's own cache writes carry live wall-clock
        # mtimes and directory listing order isn't guaranteed sorted, so a
        # plain `tar -cjf` here reproduced a different checksum on every
        # single run even with byte-identical cache contents.
        source_date_epoch=$(git log -1 --format=%ct HEAD)
        tar --sort=name --mtime="@${source_date_epoch}" \
          --owner=0 --group=0 --numeric-owner \
          -cjf "grafana-yarn-cache-${VERSION}.tar.bz2" .yarn/cache
    outputs:
      - "grafana-yarn-cache-${VERSION}.tar.bz2"
      - "grafana-yarn-cache-compression-${VERSION}.patch"

# Safety net for the vendor-pin above: confirms the pin actually took effect
# in the generated vendor archive, and would still catch a regression here
# even if a future edit removed the vendor-pin step without removing this.
policy:
  vendor-constraints:
    - package: "github.com/openfga/openfga"
      ecosystem: go
      version: "1.18.1"
      reason: "CVE-2026-61709"

post:
  # Generate the spec's bundled npm Provides from the same patched dependency
  # graph used to populate the offline Yarn cache.
  - type: run
    artifacts:
      - "grafana-${VERSION}.tar.gz"
      - "grafana-yarn-cache-compression-${VERSION}.patch"
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        # Grafana 13.1.4 incorporated the ngalert datasource authorization
        # fix carried by Patch14. Retain its audit comment and patch file, but
        # stop applying it once upstream includes the correction.
        if [ "$(printf '%s\n%s\n' '13.1.4' "${VERSION}" | sort -V | head -n1)" = '13.1.4' ]; then
          sed -i \
            's/^Patch14:[[:space:]]*grafana-ngalert-datasource-authz-cve\.patch/#Patch14:        grafana-ngalert-datasource-authz-cve.patch/' \
            grafana13.1.spec
        fi
        work_dir=$(mktemp -d)
        trap 'rm -rf "${work_dir}"' EXIT
        tar -xzf "grafana-${VERSION}.tar.gz" -C "${work_dir}"
        bash "${PACKAGE_DIR}/prepare-yarn-cache-source.sh" \
          "${work_dir}/grafana-${VERSION}" "${VERSION}"
        ./generate-bundled-npm-provides.py "${VERSION}" \
          "${work_dir}/grafana-${VERSION}"

# Same-version yarn-cache regeneration (CVE npm bump) changes the archive
# checksum while keeping the filename, so gorget needs an accepted-checksums
# exception for the new hash.
accepted-checksums:
  - file: "grafana-yarn-cache-13.1.3.tar.bz2"
    checksum: "3f466ce2b8654f9bc7b4d5023362ead08f79e74a37436ef7f03ce429313f611d02e231c65bc5ea4a86d73fd4af8c9e06c33ef496013720c56c97a4652830bfdb"
    reason: "grafana-qs-6.16.0-cve.patch bumps qs 6.15.2->6.16.0 for CVE-2026-82562/CVE-2026-82417; yarn-cache regenerated without stale qs-6.15.2 zip"
  - file: "grafana-yarn-cache-13.1.3.tar.bz2"
    checksum: "98d0ba0cf187abe1b35ec607f68a2a9ac981e5f7835c632e0b780e6ca939068d08513392b8445305c5d0ace3cbda17311035ac95f79a70371e8035490e6e187d"
    reason: "grafana-fast-uri-3.1.7-cve.patch bumps fast-uri 3.1.6->3.1.7 for CVE-2026-84394/CVE-2026-84292; yarn-cache regenerated without stale fast-uri-3.1.6 zip"
  - file: "grafana-13.1.6-vendor.tar.bz2"
