# Fetch/vendor/yarn-cache generation is handled by gorget (see
# metadata/grafana13.2.source-pipeline.yaml). This just refreshes the
# bundled npm Provides block afterward, which needs write access to the
# spec file that gorget's sandboxed run: steps don't have.
post_update: |
  set -euo pipefail
  work_dir=$(mktemp -d)
  trap 'rm -rf "${work_dir}"' EXIT
  tar -xzf "grafana-${UPDATE_NEW_VERSION}.tar.gz" -C "${work_dir}"
  source_dir="${work_dir}/grafana-${UPDATE_NEW_VERSION}"
  bash ./prepare-yarn-cache-source.sh "${source_dir}"
  ./generate-bundled-npm-provides.py "${UPDATE_NEW_VERSION}" "${source_dir}"
