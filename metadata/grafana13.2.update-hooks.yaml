# Fetch/vendor/yarn-cache generation is handled by gorget (see
# metadata/grafana13.2.source-pipeline.yaml). This just refreshes the
# bundled npm Provides block from the same patched source tree afterward.
post_update: |
  set -euo pipefail
  provides_workdir=$(mktemp -d)
  trap 'rm -rf "${provides_workdir}"' EXIT
  tar -xf "grafana-${UPDATE_NEW_VERSION}.tar.gz" -C "${provides_workdir}"
  source_dir="${provides_workdir}/grafana-${UPDATE_NEW_VERSION}"
  bash ./prepare-yarn-cache-source.sh "${source_dir}"
  ./generate-bundled-npm-provides.py "${UPDATE_NEW_VERSION}" "${source_dir}"
