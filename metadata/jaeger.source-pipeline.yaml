fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "v${VERSION}"
    archive_name: "jaeger-${VERSION}.tar.gz"
    submodules: full

toolchain:
  - name: node
    version: "24"
    minimum-version: "24.16.0"

transform:
  - type: vendor
    ecosystem: go
    archive_name: "jaeger-${VERSION}-vendor.tar.bz2"
  - type: vendor
    ecosystem: pnpm
    modules:
      - path: jaeger-ui
    archive_name: "jaeger-ui-pnpm-cache-${VERSION}.tar.bz2"
    offline-cache: true
    metadata-packages:
      - "@adobe/css-tools"

publish:
  files:
    - "jaeger-${VERSION}.tar.gz"
    - "jaeger-${VERSION}-vendor.tar.bz2"
    - "jaeger-ui-pnpm-cache-${VERSION}.tar.bz2"
