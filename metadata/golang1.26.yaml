schema_version: 1

package:
  name: golang1.26
  version: 1.26.0
  release: "1"
  license: BSD-3-Clause AND LicenseRef-Fedora-Public-Domain

tracking:
  source: https://src.fedoraproject.org/rpms/golang.git
  branch: rawhide
  last_synced_sha: 30f6caf69bce62c0317748568e3c82ded2e7feb2

pipeline:
  - name: Clone Go repository
    uses: git-checkout
    with:
      repository: https://github.com/golang/go
      ref: "go{version}"
      dest: go

  - name: Generate bundled Provides
    uses: go/bundled-provides
    with:
      source: go
      output: bundled-provides.txt

outputs:
  - type: archive
    source: go
    filename: "go{version}.src.tar.gz"
    prefix: go
    exclude:
      - .git/

spec_updates:
  # Update go_api macro (major.minor)
  - macro: go_api
    value: "{major}.{minor}"

  # Update go_patch macro
  - macro: go_patch
    value: "{patch}"

  # Update the bundled Provides block (markers must exist in spec file)
  - block: bundled-provides
    start: "# Bundled/Vendored provides generated by"
    end: "Requires:"
    content_file: bundled-provides.txt
    include_markers: true
