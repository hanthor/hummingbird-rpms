schema_version: 1

package:
  name: javapackages-tools
  version: 6.4.1
  release: "1"
  license: BSD-3-Clause

tracking:
  source: https://src.fedoraproject.org/rpms/javapackages-tools.git
  branch: rawhide
  last_synced_sha: b281f3ebdddf455e5817642cab0192329f90f9df

pipeline:
  - name: Clone javapackages repository
    uses: git-checkout
    with:
      repository: https://github.com/fedora-java/javapackages
      ref: "{version}"
      dest: "javapackages-{version}"

outputs:
  - type: archive
    source: "javapackages-{version}"
    filename: "{version}.tar.gz"
    prefix: "javapackages-{version}"
    exclude:
      - .git/

spec_updates:
  - tag: Version
    value: "{version}"
  - tag: Release
    value: "{release}%{?dist}"
