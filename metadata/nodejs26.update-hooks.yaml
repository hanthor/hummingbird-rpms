# Node's main Version and Release tags deliberately derive from the first
# nodejs_define_version macro: the same values are used in Source and in the
# independently-versioned npm/v8 subpackages.  The generic updater otherwise
# replaces Version with a literal and leaves this macro stale.
update_spec: |
  set -euo pipefail
  spec_file="${UPDATE_SPEC_FILE:-nodejs26.spec}"

  if [[ ! "${UPDATE_NEW_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
    echo "Unsupported Node.js version: ${UPDATE_NEW_VERSION}" >&2
    exit 1
  fi

  macro_pattern='^%nodejs_define_version[[:space:]]+node[[:space:]]+[0-9]+:[0-9]+(\.[0-9]+){2}-[^[:space:]]+.*$'
  if [[ "$(grep -Ec "${macro_pattern}" "${spec_file}")" -ne 1 ]]; then
    echo "Expected exactly one nodejs_define_version node macro in ${spec_file}" >&2
    exit 1
  fi

  sed -E -i \
    -e "s|^(%nodejs_define_version[[:space:]]+node[[:space:]]+[0-9]+:)[0-9]+(\.[0-9]+){2}-[^[:space:]]+(.*)$|\\1${UPDATE_NEW_VERSION}-0.1%{?dist}\\3|" \
    -e '0,/^Version:[[:space:]]*/s/^Version:.*/Version:        %{node_version}/' \
    -e '0,/^Release:[[:space:]]*/s/^Release:.*/Release:        %{node_release}/' \
    "${spec_file}"
