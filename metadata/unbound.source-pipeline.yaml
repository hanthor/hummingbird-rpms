fetch:
  - type: url
    url: "https://nlnetlabs.nl/downloads/unbound/unbound-${VERSION}.tar.gz"
  - type: url
    url: "https://nlnetlabs.nl/downloads/unbound/unbound-${VERSION}.tar.gz.asc"

