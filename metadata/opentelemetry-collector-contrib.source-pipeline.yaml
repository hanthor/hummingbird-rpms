fetch:
  - type: url
    url: "https://github.com/open-telemetry/opentelemetry-collector-releases/archive/v${VERSION}/opentelemetry-collector-releases-${VERSION}.tar.gz"
    filename: "opentelemetry-collector-releases-${VERSION}.tar.gz"

transform:
  - type: run
    path: "opentelemetry-collector-releases-${VERSION}"
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        # Hummingbird's build runners are amd64-only; revisit if that changes.
        curl -fSL -o "/tmp/ocb-${VERSION}" \
          "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/cmd%2Fbuilder%2Fv${VERSION}/ocb_${VERSION}_linux_amd64"
        chmod +x "/tmp/ocb-${VERSION}"

        # otelcol-contrib 0.156.0+ includes OBI (eBPF instrumentation), which uses
        # a local replace directive pointing to internal/obi-src. prepare-obi.sh
        # fetches the pre-generated source tarball into that path.
        if [ -f scripts/prepare-obi.sh ]; then
          bash scripts/prepare-obi.sh otelcol-contrib
        fi

        # _build/go.mod's replace directive reaches ../../../internal/obi-src --
        # 3 levels up from _build/ (repo dir -> _transform_source -> work_dir),
        # i.e. 2 levels up from here. Symlink the prepared OBI source there so
        # `go mod tidy` can find it.
        if [ -d internal/obi-src ]; then
          mkdir -p ../../internal
          ln -sfn "$(pwd)/internal/obi-src" ../../internal/obi-src
        fi

        "/tmp/ocb-${VERSION}" --skip-compilation --config distributions/otelcol-contrib/manifest.yaml

        # CVE-2026-79921/CVE-2026-107386: the forced amqp091-go floor that
        # used to live here (go get .../amqp091-go@v1.13.0, fixing
        # CVE-2026-79921) is gone as of this update. rabbitmqexporter and
        # internal/rabbitmq both re-tag amqp091-go version with every
        # otelcol-contrib release; their v0.161.0 tags required amqp091-go
        # v1.13.0 (vulnerable to CVE-2026-107386, fixed in v1.14.0), but
        # their current v0.162.0 tags -- which OCB's manifest already
        # resolves to at this package version -- require amqp091-go
        # v1.15.0 on their own, well past the fix. Pinning an older floor
        # here would only force Go's MVS to downgrade rabbitmqexporter/
        # internal/rabbitmq back to their v0.161.0 tags (and amqp091-go
        # back down) to satisfy the pin, which is counter to the goal. If a
        # future otelcol-contrib release regresses amqp091-go below
        # v1.14.0 again, restore a `go get .../amqp091-go@v<fixed>` pin
        # here (see HUM-6504 for the previous occurrence).
        pushd _build
        # HUM-6526 CI: the buildroot's golang provides go1.27, but the vendored
        # cockroachdb/swiss (as of upstream commit b0f6560f979b) gates its
        # runtime shim (hashFn/getRuntimeHasher/fastrand64) behind a `!go1.27`
        # build tag, so those symbols go undefined and %build fails on every
        # arch. Pin to the upstream commit that added go1.27 support. Drop
        # this once OCB's manifest naturally resolves >= this commit.
        go get github.com/cockroachdb/swiss@v0.0.0-20260820225851-aa852fb3c14e
        go mod tidy
        popd
        # Go 1.27 also breaks SermoDigital/jose (RegisterHash of Hash(0) in
        # crypto/none.go init → panic at process start). No upstream pin
        # exists; see go-vendor-tools.toml post_commands (cloudfoundry/cli#3851
        # workaround applied to the vendored copy).

        generated_files=(go.mod go.sum)
        while IFS= read -r f; do
          generated_files+=("$f")
        done < <(find _build -maxdepth 1 -name '*.go' -printf '%P\n' | sort)
        # --sort/--mtime/--owner/--group/--numeric-owner: go.mod/go.sum/*.go are
        # freshly written by OCB above, so a plain tar picks up wall-clock mtimes
        # and produces a different checksum on every run even with identical
        # content -- pin these so the archive is reproducible.
        tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
          -C _build -cjf "opentelemetry-collector-contrib-${VERSION}-generated.tar.bz2" "${generated_files[@]}"
    outputs:
      - "opentelemetry-collector-contrib-${VERSION}-generated.tar.bz2"
  - type: vendor
    ecosystem: go
    archive_name: "opentelemetry-collector-contrib-${VERSION}-vendor.tar.bz2"
    modules:
      - path: "opentelemetry-collector-releases-${VERSION}/_build"

# Same-version regeneration for CVE-2026-107386 (dropped the amqp091-go
# pin above -- OCB's manifest-driven resolution now pulls amqp091-go
# v1.15.0 natively via rabbitmqexporter/internal/rabbitmq v0.162.0, so
# removing the stale v1.13.0 floor changes both archive checksums while
# keeping the 0.162.0 filenames) needs its own accepted-checksums
# exceptions, same pattern as the 0.159.0 entries below for the previous
# amqp091-go-related change.
accepted-checksums:
  - file: "opentelemetry-collector-contrib-0.162.0-generated.tar.bz2"
    checksum: "c91214dcc0bd3e1908041a80d13760489ae590ae2db1684f97538e597e30763cd92003473acdffdc93c774a617b9382b133d5706508a3bcf14c387ef5451db4e"
    reason: "CVE-2026-107386: removed the amqp091-go v1.13.0 floor pin
      (added for CVE-2026-79921). OCB's manifest-driven go.mod now
      resolves github.com/rabbitmq/amqp091-go to v1.15.0 directly via
      rabbitmqexporter/internal/rabbitmq v0.162.0's own go.mod
      requirement, so the forced go get/go mod tidy sequence is no
      longer needed and only risked downgrading those two components
      back to their v0.161.0 tags (HUM-9625/HUM-9649)."

  - file: "opentelemetry-collector-contrib-0.162.0-vendor.tar.bz2"
    checksum: "0c9ba745deb07bb72fc91841d7220804ef9305834eb482cdb65907d195db567cc5bdddcfa5ac19b1112f4122cc62f05f3609f3a176552c6de5c1adf4bb1568dc"
    reason: "CVE-2026-107386: vendor archive regenerated after dropping
      the amqp091-go v1.13.0 floor pin, now vendoring amqp091-go v1.15.0
      (resolved natively via rabbitmqexporter/internal/rabbitmq v0.162.0)
      instead of the forced-down v1.13.0 (HUM-9625/HUM-9649)."

  - file: "opentelemetry-collector-contrib-0.159.0-generated.tar.bz2"
    checksum: "5cae0f95d1caebcaa254afefd82882f33a1941cb6c53dcb1768fb74bddca7a48e3247c9544b67d015e4de52574c0969929fca98eaf05a94f57aeaef6c9d084ed"
    reason: "CVE-2026-79921: forced amqp091-go v1.12.0 -> v1.13.0 in _build/go.mod
      and go.sum; also forced cockroachdb/swiss to the upstream commit that
      added go1.27 support (map.go referenced hashFn/getRuntimeHasher/
      fastrand64 from a runtime shim gated behind `!go1.27`, which the
      buildroot's golang no longer satisfies) before tarring the generated
      sources (HUM-6504/HUM-6526)."

  - file: "opentelemetry-collector-contrib-0.159.0-vendor.tar.bz2"
    checksum: "42b2b7fccc0af39ffaf429cb468f588ebec64cf74b497f47ee2e764b2441046aa8f055fb602b29a90003116abfc7c17633b7178136a274f25e9af29285f9ea78"
    reason: "CVE-2026-79921: vendor archive regenerated against the amqp091-go
      v1.13.0 and cockroachdb/swiss go1.27-support bumps, plus
      go-vendor-tools.toml post_command removing SermoDigital/jose's
      crypto.RegisterHash(Hash(0), ...) (Go 1.27 startup panic; same
      workaround as cloudfoundry/cli#3851) (HUM-6504/HUM-6526)."
