schema_version: 1

package:
  name: java-21-openjdk-portable
  version: 21.0.10.7
  release: "2"
  license: Apache-2.0 AND GPL-2.0-or-later WITH Classpath-exception-2.0

tracking:
  source: https://src.fedoraproject.org/rpms/java-21-openjdk-portable.git
  branch: f43
  last_synced_sha: dc620a02d880a173dc5c2fc16cc192b9e5a9f1d9

# OpenJDK source - using the official OpenJDK GitHub repository
pipeline:
  - name: Clone OpenJDK repository
    uses: git-checkout
    with:
      repository: https://github.com/openjdk/jdk21u
      ref: jdk-21.0.10+7
      dest: openjdk-21.0.10+7

outputs:
  - type: archive
    source: openjdk-21.0.10+7
    filename: openjdk-21.0.10+7.tar.xz
    exclude:
      - .git/

spec_updates:
  - tag: Version
    value: "{version}"
  - tag: Release
    value: "{release}%{?dist}"
