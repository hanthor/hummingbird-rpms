fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "v${VERSION}"
    archive_name: "prometheus-${VERSION}.tar.gz"
  - type: vendor
    ecosystem: go
    archive_name: "prometheus-${VERSION}-vendor.tar.bz2"
    modules:
      - path: "."
        use_workspace: false

transform:
  - type: run
    path: "."
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        root="$(pwd)"
        patch -p1 < "${PACKAGE_DIR}/0003-pnpm-cache-both-rpm-architectures.patch"
        npm install --prefix "${root}/.pnpm" --ignore-scripts pnpm@11
        pnpm="${root}/.pnpm/node_modules/.bin/pnpm"
        pnpm_store="${root}/.pnpm-store"
        (cd web/ui && "${pnpm}" fetch --frozen-lockfile --ignore-scripts --store-dir "${pnpm_store}")
        (cd web/ui/react-app && "${pnpm}" fetch --frozen-lockfile --ignore-scripts --store-dir "${pnpm_store}")
        tar -cjf "prometheus-pnpm-cache-${VERSION}.tar.bz2" -C "${root}" .pnpm .pnpm-store
    outputs:
      - "prometheus-pnpm-cache-${VERSION}.tar.bz2"

post:
  - type: run
    artifacts: ["prometheus-${VERSION}.tar.gz"]
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        ./generate-bundled-npm-provides.py "${VERSION}"

accepted-checksums:
  - file: "prometheus-3.13.5-vendor.tar.bz2"
    checksum: "20b4b03477e4c3fea013840fa28dbe72499fd413a9d686b23c30ef7273319962e6164c816c0ae831fac5cfa2c6b99da16da8d512319f9f49330b0b881708035b"
    reason: "go-vendor-tools.toml pre_commands bumps github.com/klauspost/compress to v1.20.2 for CVE-2026-116591 and the OpenTelemetry-Go modules to v1.47.0 for CVE-2026-128085 (attribute truncation bypass); vendor archive regenerated to include the patched dependencies"
