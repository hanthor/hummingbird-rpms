# Fetch the upstream git tag that matches Fedora's Vim version.
# Keep ref and vim.spec's baseversion/patchlevel in sync.
# Vim tags pad patchlevels shorter than four digits with zeroes.
#
# Keep archive_name as vim92.tar.gz for the Vim 9.2 series.
# Its root directory must match vim.spec's %{vimdir} setup directory.
# The archive's src/version.c reports included_patches[0] == 1202.
fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "v9.2.1202"
    archive_name: "vim92.tar.gz"

accepted-checksums:
  - file: "vim92.tar.gz"
    checksum: "fbe615ff2ffa903b8d9706ecf59d1c79c8bb026890fb9a6abd641c0c70a2c42ad2e16e4b2955c7dac8b1912328bdef149ae222c87778c38a3e9f9b7a543dcdd8"
    reason: "Update from upstream tag v9.2.1129 to v9.2.1202 to match Fedora. The archive name remains vim92.tar.gz to match vim.spec's setup directory."

  # New upstream git tag for v9.2.1129; archive_name stays vim92.tar.gz
  # to match %{vimdir} in vim.spec.
  - file: "vim92.tar.gz"
    checksum: "10f18f052d341e8545c5ca4721f9a9845b52313660aa5184cf2bf0b1e093a81476054c3de46987e07e438a9f68326614d1f0279cce43d16767570bdc44278aea"
    reason: "Update from v9.2.0967 to v9.2.1129 for HUM-8569
      (CVE: Ex command injection in sign_jump())."

