# ftp.vim.org has been fully decommissioned (NXDOMAIN) with no HTTPS/mirror
# replacement -- the original release tarball (vim-9.2-1129.tar.bz2) is
# permanently unavailable, so unlike other packages in this migration there
# is no way to verify byte-identical content against it. Fetches the
# equivalent git tag instead, and manually confirmed the extracted tree is
# genuinely vim 9.2.1129 (src/version.c's included_patches[] top entry is
# 1129, matching this package's patchlevel).
#
# vim's git tags zero-pad the patchlevel (v9.2.1129) but this package's
# metadata `version` does not (9.2.1129), so the ref can't be templated from
# ${VERSION} -- pinned literally instead, same manual-update model as
# glibc's source-pipeline.yaml: update `ref` here together with
# `baseversion`/`patchlevel` in vim.spec on each version bump.
#
# archive_name matches vim.spec's `%{vimdir}` macro (vim92) so
# `%setup -n %{vimdir}` finds the expected directory name; this stays
# "vim92" for the whole 9.2.x series and only changes when baseversion does.
fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "v9.2.1129"
    archive_name: "vim92.tar.gz"

accepted-checksums:
  # New upstream git tag for v9.2.1129; archive_name stays vim92.tar.gz
  # to match %{vimdir} in vim.spec.
  - file: "vim92.tar.gz"
    checksum: "10f18f052d341e8545c5ca4721f9a9845b52313660aa5184cf2bf0b1e093a81476054c3de46987e07e438a9f68326614d1f0279cce43d16767570bdc44278aea"
    reason: "Update from v9.2.0967 to v9.2.1129 for HUM-8569
      (CVE: Ex command injection in sign_jump())."

