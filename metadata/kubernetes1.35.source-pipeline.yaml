fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "v${VERSION}"
    archive_name: "kubernetes-${VERSION}.tar.gz"
  - type: vendor
    ecosystem: go
    archive_name: "kubernetes-${VERSION}-vendor.tar.bz2"
    # Apply the overrides in rpms/kubernetes1.35/go-vendor-tools.toml's
    # [archive.dependency_overrides] in an isolated vendor tree, then
    # synchronize only the root go.mod/go.sum/go.work/go.work.sum to Source0
    # before it is repacked.
    sync_go_modules: true

post:
  - type: run
    command:
      - sh
      - -c
      - |
        set -eu
        if [ "$(grep -Ec '^%global k8s_tag[[:space:]]+v[0-9.]+$' "${SPEC_FILE}")" -ne 1 ]; then
          echo "Expected one k8s_tag macro in ${SPEC_FILE}" >&2
          exit 1
        fi
        sed -Ei 's/^(%global k8s_tag[[:space:]]+)v[0-9.]+$/\1v${VERSION}/' "${SPEC_FILE}"

accepted-checksums:
  # HUM-12802 / CVE-2026-128085: bump the OpenTelemetry-Go modules to v1.47.0
  # via dependency_overrides and pre_commands; sync_go_modules updates Source0
  # go.mod/go.sum/go.work/go.work.sum to match.
  - file: "kubernetes-1.35.10.tar.gz"
    checksum: "1d4c3f538733cc1312656a0b9b5c1805f183ca02e80a7d17d2ab707e7747e878bb6daced92ba153bb0e3b510008e6df2de4f31a47b60bfbf422a690983772ece"
    reason: "HUM-12802: Source0 root go.mod/go.sum/go.work/go.work.sum synced for OpenTelemetry-Go v1.47.0 (CVE-2026-128085); remaining source files unchanged from v1.35.10."
  - file: "kubernetes-1.35.10-vendor.tar.bz2"
    checksum: "84cbeb6711d764ecad7308edf56734f1cee2bcb8cadca59f8065037356c23e7e30257d8f71e7df29cd7a51c2736ba25399ba367898431ce8a165bb6ecce53b4c"
    reason: "HUM-12802: vendor archive regenerated with OpenTelemetry-Go v1.47.0 for CVE-2026-128085."
