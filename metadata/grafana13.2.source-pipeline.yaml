# Requires gorget 0.1.28-0.3 or newer for dependency files and Yarn version arrays.
toolchain:
  - name: node
    version: '24'
fetch:
  - type: git
    repo: ${UPSTREAM_REPO}
    ref: v${VERSION}
    archive_name: grafana-${VERSION}.tar.gz
transform:
  - type: vendor-bump
    ecosystem: go
    deps: grafana13.2.dependencies.yaml
  - type: vendor
    ecosystem: go
    archive_name: grafana-${VERSION}-vendor.tar.bz2
  - type: patch
    file: grafana-storybook-chunk-path.patch
  - type: vendor-bump
    ecosystem: yarn
    deps: grafana13.2.dependencies.yaml
  - type: vendor
    ecosystem: yarn
    archive_name: grafana-yarn-cache-${VERSION}.tar.bz2
    modules:
      - path: .
        name: .yarn/cache
    platforms:
      - cpu: x64
      - cpu: arm64
      - cpu: s390x
post:
  - type: bundled-provides
    ecosystem: yarn
    scope: production
    output: bundled-npm-provides.inc

