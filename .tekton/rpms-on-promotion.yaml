            value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
          - name: toolImage
            value: $(params.tool-image)
          - name: archiveUrl
            value: $(params.archive-url)
          - name: mergeCommit
            value: $(params.revision)
          - name: namespace
            value: hummingbird-tenant
          - name: application
            value: rpms-main
          - name: component
            value: ctags-main
          - name: targetBranch
            value: $(params.target-branch)
          - name: targetRepository
            value: $(params.git-url)
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://gitlab.com/redhat/hummingbird/tools.git
            - name: revision
              value: d5df0dc6173e87acdc45f1aa0c459258a02cef15
            - name: pathInRepo
              value: hummingbird-tools/tekton/find-tested-mr-artifact.yaml
      - name: create-promotion-component
        params:
          - name: sourceArtifact
            value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
          - name: toolImage
            value: $(params.tool-image)
          - name: archiveUrl
            value: $(params.archive-url)
          - name: mergeCommit
            value: $(params.revision)
          - name: namespace
            value: hummingbird-tenant
          - name: application
            value: rpms-main
          - name: component
            value: ctags-main
          - name: targetBranch
            value: $(params.target-branch)
          - name: targetRepository
            value: $(params.git-url)
          - name: promotionPipelineRun
            value: $(context.pipelineRun.name)
          - name: sourceSnapshot
            value: $(tasks.find-tested-mr-artifact.results.SNAPSHOT)
          - name: buildPipelineRun
            value: $(tasks.find-tested-mr-artifact.results.BUILD_PIPELINERUN)
          - name: image
            value: $(tasks.find-tested-mr-artifact.results.IMAGE)
          - name: sourceSha
            value: $(tasks.find-tested-mr-artifact.results.SOURCE_SHA)
          - name: sourceUrl
            value: $(tasks.find-tested-mr-artifact.results.SOURCE_URL)
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://gitlab.com/redhat/hummingbird/tools.git
            - name: revision
              value: d5df0dc6173e87acdc45f1aa0c459258a02cef15
            - name: pathInRepo
              value: hummingbird-tools/tekton/create-promotion-component.yaml
    workspaces:
      - name: git-auth
