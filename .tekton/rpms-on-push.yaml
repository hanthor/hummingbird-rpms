    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && target_branch == "main" && (
        files.all.exists(x,
          (
               x.matches("^rpms/kbd/")
          )
        )
      )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: rpms-main
    appstudio.openshift.io/component: kbd-main
    pipelines.appstudio.openshift.io/type: build
  name: kbd-main-on-push
  namespace: hummingbird-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: purl-rpm-namespace
      value: "redhat"
    - name: ociStorage
      value: quay.io/redhat-user-workloads/hummingbird-tenant/kbd-main:{{revision}}
    - name: package-name
      value: kbd
    - name: target-branch
      value: '{{target_branch}}'
    - name: build-architectures
      value:
        - aarch64
        - x86_64
        - s390x
    - name: build-platforms
      value:
        - "linux/x86_64"
        - "linux/arm64"
        - "linux/s390x"
    - name: specfile
      value: "kbd.spec"
    - name: monorepo-subdir
      value: "rpms/kbd"
    - name: mock-config-template-filename-in-sources
      value: "mock/mock.cfg"
    - name: dist-git-client-configdir
      value: "mock/"
    - name: forked-from
      value: "https://gitlab.com/redhat/hummingbird/rpms"
  pipelineRef:
    resolver: bundles
    params:
      - name: name
