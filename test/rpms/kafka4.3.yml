---
# Tests specific to the kafka package

kafka-files-installed:
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "kafka4.3" ]]; then
      echo "Skipping: This test only runs on kafka (got: ${rpm_name})"
      exit 0
    fi

    file_list=$(rpm -qlp "${TEST_RPM}")

    for expected in \
      /usr/lib/kafka4.3/bin/kafka-server-start.sh \
      /usr/lib/kafka4.3/bin/kafka-topics.sh \
      /usr/lib/kafka4.3/bin/kafka-console-producer.sh \
      /usr/lib/kafka4.3/bin/kafka-console-consumer.sh \
      /usr/lib/kafka4.3/bin/kafka-storage.sh \
      /usr/lib/kafka4.3/config/server.properties; do
      if ! echo "${file_list}" | grep -qF "${expected}"; then
        TEST_FAIL "Expected file not found in RPM: ${expected}"
      fi
    done

    echo "PASS: All expected Kafka files present in RPM"

no-windows-files:
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "kafka4.3" ]]; then
      echo "Skipping: This test only runs on kafka (got: ${rpm_name})"
      exit 0
    fi

    file_list=$(rpm -qlp "${TEST_RPM}")
    if echo "${file_list}" | grep -q '\.bat$'; then
      TEST_FAIL "Windows .bat files found in RPM"
    fi
    if echo "${file_list}" | grep -q '/windows/'; then
      TEST_FAIL "Windows directory found in RPM"
    fi

    echo "PASS: No Windows files in RPM"

kafka-produce-consume:
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "kafka4.3" ]]; then
      echo "Skipping: This test only runs on kafka4.3 (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    cleanup() { rm -rf "${build_dir}"; }
    trap cleanup EXIT

    mkdir -p "${build_dir}/local-repo"
    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi
    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/hummingbird-builder:latest createrepo_c /repo

    "${TEST_ENGINE}" run --rm \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/hummingbird-builder:latest \
      bash -c '
        set -euo pipefail
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo
        dnf install -y kafka4.3

        export PATH=/usr/lib/kafka4.3/bin:$PATH
        failed=0

        # Format KRaft storage
        CLUSTER_ID=$(kafka-storage.sh random-uuid)
        kafka-storage.sh format -t "$CLUSTER_ID" \
          -c /usr/lib/kafka4.3/config/server.properties --standalone

        # Start Kafka
        kafka-server-start.sh /usr/lib/kafka4.3/config/server.properties &
        KAFKA_PID=$!
        for i in $(seq 1 30); do
          kafka-topics.sh --list --bootstrap-server localhost:9092 >/dev/null 2>&1 && break
          sleep 1
        done

        # Create topic
        kafka-topics.sh --create --topic test-topic \
          --partitions 1 --replication-factor 1 \
          --bootstrap-server localhost:9092

        # Produce and consume
        echo "hello-kafka-rpm-test" | kafka-console-producer.sh \
          --topic test-topic --bootstrap-server localhost:9092

        msg=$(kafka-console-consumer.sh --topic test-topic \
          --from-beginning --max-messages 1 --timeout-ms 10000 \
          --bootstrap-server localhost:9092 2>/dev/null)

        if [[ "$msg" == "hello-kafka-rpm-test" ]]; then
          echo "PASS: produce/consume cycle works"
        else
          echo "FAIL: expected hello-kafka-rpm-test, got: $msg"
          failed=1
        fi

        kill $KAFKA_PID 2>/dev/null
        wait $KAFKA_PID 2>/dev/null || true
        exit $failed
      '
