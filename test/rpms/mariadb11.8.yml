---
# Tests specific to the mariadb11.8 package

versioned-package-name:
  summary: Ensure all subpackages use versioned names (mariadb11.8-*), not unversioned (mariadb-*)
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")

    # All binary RPMs from this SRPM must start with "mariadb11.8"
    if [[ "${rpm_name}" != mariadb11.8* ]]; then
      TEST_FAIL "Package name '${rpm_name}' does not use versioned prefix 'mariadb11.8'"
    fi
