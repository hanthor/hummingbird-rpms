---
# Tests for ca-certificates and ca-certificates-bundle subpackage

bundle-no-runtime-deps:
  summary: Verify bundle subpackage has no heavyweight runtime dependencies
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    requires=$(rpm -qRp "${TEST_RPM}")

    for dep in bash grep sed findutils p11-kit p11-kit-trust libffi; do
      if echo "${requires}" | grep -qwF "${dep}"; then
        TEST_FAIL "ca-certificates-bundle should not require '${dep}'"
      fi
    done

    echo "PASS: ca-certificates-bundle has no heavyweight runtime dependencies"

bundle-provides-ca-certificates:
  summary: Verify bundle provides ca-certificates
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    provides=$(rpm -qp --provides "${TEST_RPM}")

    if ! echo "${provides}" | grep -q "^ca-certificates = "; then
      TEST_FAIL "ca-certificates-bundle must Provide ca-certificates"
    fi

    echo "PASS: ca-certificates-bundle provides ca-certificates"

bundle-conflicts-main-package:
  summary: Verify bundle conflicts with ca-certificates and p11-kit-trust
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    conflicts=$(rpm -qp --conflicts "${TEST_RPM}")

    if ! echo "${conflicts}" | grep -q "ca-certificates"; then
      TEST_FAIL "ca-certificates-bundle must conflict with ca-certificates"
    fi

    if ! echo "${conflicts}" | grep -q "p11-kit-trust"; then
      TEST_FAIL "ca-certificates-bundle must conflict with p11-kit-trust"
    fi

    echo "PASS: ca-certificates-bundle conflicts with ca-certificates and p11-kit-trust"

bundle-ships-pem-bundles:
  summary: Verify bundle ships the pre-extracted PEM bundle files
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    # Write file list to a tmpfile and grep from it. Avoids pipefail+SIGPIPE:
    # rpm -qlp output is ~75KB (exceeds 64KB pipe buffer), so grep -q exiting
    # early causes rpm to get SIGPIPE (exit 141), and pipefail reports that
    # as the pipeline exit status even though grep found the match.
    filelist=$(mktemp)
    trap 'rm -f "${filelist}"' EXIT
    rpm -qlp "${TEST_RPM}" > "${filelist}"

    for expected in \
      /usr/share/pki/ca-certificates-bundle/extracted/pem/tls-ca-bundle.pem \
      /usr/share/pki/ca-certificates-bundle/extracted/pem/email-ca-bundle.pem \
      /usr/share/pki/ca-certificates-bundle/extracted/pem/objsign-ca-bundle.pem \
      /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem \
      /etc/pki/ca-trust/extracted/pem/email-ca-bundle.pem \
      /etc/pki/ca-trust/extracted/pem/objsign-ca-bundle.pem \
      /etc/pki/tls/cert.pem \
      /etc/pki/tls/certs/ca-bundle.crt \
      /etc/pki/tls/certs/ca-certificates.crt \
      /etc/ssl/cert.pem; do
      if ! grep -qFx "${expected}" "${filelist}"; then
        TEST_FAIL "Expected file not found in RPM: ${expected}"
      fi
    done

    echo "PASS: ca-certificates-bundle ships all expected PEM bundle files"

bundle-ships-directory-hash:
  summary: Verify bundle ships directory-hash certs for OpenSSL CApath compatibility
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")

    # Check that directory-hash entries exist (format: 8 hex chars + .N)
    hash_count=$(echo "${files}" | grep -cE '/[0-9a-f]{8}\.[0-9]+$' || true)

    if [[ "${hash_count}" -eq 0 ]]; then
      TEST_FAIL "ca-certificates-bundle ships no directory-hash cert entries"
    fi

    # Verify hash entries exist in all three expected locations
    for dir in \
      /usr/share/pki/ca-certificates-bundle/extracted/pem/directory-hash \
      /etc/pki/ca-trust/extracted/pem/directory-hash \
      /etc/pki/tls/certs; do
      dir_count=$(echo "${files}" | grep -c "^${dir}/[0-9a-f]" || true)
      if [[ "${dir_count}" -eq 0 ]]; then
        TEST_FAIL "No directory-hash entries found in ${dir}"
      fi
    done

    echo "PASS: ca-certificates-bundle ships ${hash_count} directory-hash entries across all locations"

bundle-has-no-scripts:
  summary: Verify bundle has no pre/post install scripts
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    scripts=$(rpm -qp --scripts "${TEST_RPM}")

    if [[ -n "${scripts}" ]]; then
      TEST_FAIL "ca-certificates-bundle should have no scriptlets, but found:\n${scripts}"
    fi

    echo "PASS: ca-certificates-bundle has no install scripts"

bundle-pem-bundles-non-empty:
  summary: Verify the pre-extracted PEM bundles contain actual certificates
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    # Extract the RPM to a temp dir and check the PEM bundle contents
    extract_dir=$(mktemp -d)
    trap 'rm -rf "${extract_dir}"' EXIT

    rpm2cpio "${TEST_RPM}" | (cd "${extract_dir}" && cpio -idm 2>/dev/null)

    bundle="${extract_dir}/usr/share/pki/ca-certificates-bundle/extracted/pem/tls-ca-bundle.pem"

    if [[ ! -s "${bundle}" ]]; then
      TEST_FAIL "tls-ca-bundle.pem is empty or missing"
    fi

    cert_count=$(grep -c 'BEGIN CERTIFICATE' "${bundle}" || true)

    if [[ "${cert_count}" -lt 50 ]]; then
      TEST_FAIL "tls-ca-bundle.pem contains only ${cert_count} certificates (expected at least 50)"
    fi

    echo "PASS: tls-ca-bundle.pem contains ${cert_count} certificates"

bundle-symlinks-correct:
  summary: Verify symlinks in standard locations point to the bundle files
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    extract_dir=$(mktemp -d)
    trap 'rm -rf "${extract_dir}"' EXIT

    rpm2cpio "${TEST_RPM}" | (cd "${extract_dir}" && cpio -idm 2>/dev/null)

    for pem in tls-ca-bundle.pem email-ca-bundle.pem objsign-ca-bundle.pem; do
      link="${extract_dir}/etc/pki/ca-trust/extracted/pem/${pem}"
      expected_target="/usr/share/pki/ca-certificates-bundle/extracted/pem/${pem}"

      if [[ ! -L "${link}" ]]; then
        TEST_FAIL "${pem} at standard path is not a symlink"
      fi

      actual_target=$(readlink "${link}")
      if [[ "${actual_target}" != "${expected_target}" ]]; then
        TEST_FAIL "${pem} symlink points to '${actual_target}', expected '${expected_target}'"
      fi
    done

    # Verify compatibility symlinks that OpenSSL/curl/git need.
    # These should all point to the extracted PEM bundle path.
    bundle_pem="/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem"

    for compat_link in \
      etc/pki/tls/cert.pem \
      etc/pki/tls/certs/ca-bundle.crt \
      etc/pki/tls/certs/ca-certificates.crt \
      etc/ssl/cert.pem; do
      link="${extract_dir}/${compat_link}"

      if [[ ! -L "${link}" ]]; then
        TEST_FAIL "/${compat_link} is not a symlink"
      fi

      actual_target=$(readlink "${link}")
      if [[ "${actual_target}" != "${bundle_pem}" ]]; then
        TEST_FAIL "/${compat_link} points to '${actual_target}', expected '${bundle_pem}'"
      fi
    done

    echo "PASS: All PEM bundle and compat symlinks point to correct targets"

bundle-install-and-verify:
  summary: Install bundle in a container and verify TLS works
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    trap 'rm -rf "${build_dir}"' EXIT
    mkdir -p "${build_dir}/local-repo"

    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi

    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/builder:latest createrepo_c /repo

    repo_root=$(git rev-parse --show-toplevel)

    "${TEST_ENGINE}" run --rm --cap-add=ALL \
      -v "${repo_root}/ci/repos:/tmp/repos:ro,z" \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/builder:latest-hatchling \
      bash -c '
        set -e
        NEWROOT=/new-root-fs

        cp /tmp/repos/*.repo /etc/yum.repos.d/
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo

        DNF="dnf-installroot ${NEWROOT} -y --use-host-config --nodocs --setopt=install_weak_deps=False"

        mkdir -p "${NEWROOT}"
        rpmkeys --import /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-43-primary --root "${NEWROOT}"

        ${DNF} install filesystem
        ${DNF} install ca-certificates-bundle openssl gawk

        # Verify the package installed (not the full ca-certificates)
        rpm --root="${NEWROOT}" -q ca-certificates-bundle || \
          { echo "FAIL: ca-certificates-bundle not installed"; exit 1; }

        # Verify the full ca-certificates is NOT installed
        if rpm --root="${NEWROOT}" -q ca-certificates 2>/dev/null; then
          echo "FAIL: full ca-certificates should not be installed alongside bundle"
          exit 1
        fi

        # Verify PEM bundle symlink exists at standard path
        bundle="${NEWROOT}/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem"
        if [[ ! -L "${bundle}" ]]; then
          echo "FAIL: tls-ca-bundle.pem is not a symlink at standard path"
          ls -la "${NEWROOT}/etc/pki/ca-trust/extracted/pem/" || true
          exit 1
        fi

        # Resolve the symlink relative to NEWROOT (absolute symlinks do not
        # resolve from the host because they point to /usr/share/... not
        # ${NEWROOT}/usr/share/...)
        link_target=$(readlink "${bundle}")
        resolved="${NEWROOT}${link_target}"
        if [[ ! -f "${resolved}" ]]; then
          echo "FAIL: symlink target ${link_target} does not exist under installroot"
          exit 1
        fi

        cert_count=$(grep -c "BEGIN CERTIFICATE" "${resolved}")
        if [[ "${cert_count}" -lt 50 ]]; then
          echo "FAIL: tls-ca-bundle.pem has only ${cert_count} certs (expected >= 50)"
          exit 1
        fi

        # Verify directory-hash certs exist
        hash_count=$(find "${NEWROOT}/etc/pki/tls/certs" -maxdepth 1 -name "????????.?" | wc -l)
        if [[ "${hash_count}" -eq 0 ]]; then
          echo "FAIL: No directory-hash certs in /etc/pki/tls/certs"
          exit 1
        fi

        # Verify compat symlinks exist
        for compat in \
          /etc/pki/tls/cert.pem \
          /etc/pki/tls/certs/ca-bundle.crt \
          /etc/pki/tls/certs/ca-certificates.crt \
          /etc/ssl/cert.pem; do
          if [[ ! -L "${NEWROOT}${compat}" ]]; then
            echo "FAIL: compat symlink ${compat} missing"
            exit 1
          fi
        done

        # End-to-end test: use chroot + openssl verify through the real
        # system paths (/etc/pki/tls/cert.pem) to prove the full symlink
        # chain works. Extract the first root CA from the bundle, write it
        # into the installroot, then verify it.
        chroot "${NEWROOT}" gawk "/-----BEGIN CERTIFICATE-----/{found=1} found{print} /-----END CERTIFICATE-----/{if(found) exit}" \
          /etc/pki/tls/cert.pem > "${NEWROOT}/tmp/test-root-ca.pem"

        if ! chroot "${NEWROOT}" openssl verify \
          -CAfile /etc/pki/tls/cert.pem /tmp/test-root-ca.pem; then
          echo "FAIL: openssl verify through /etc/pki/tls/cert.pem failed"
          exit 1
        fi
        echo "  openssl verify through /etc/pki/tls/cert.pem: OK"

        if ! chroot "${NEWROOT}" openssl verify \
          -CApath /etc/pki/tls/certs /tmp/test-root-ca.pem; then
          echo "FAIL: openssl verify through /etc/pki/tls/certs (CApath) failed"
          exit 1
        fi
        echo "  openssl verify through /etc/pki/tls/certs (CApath): OK"

        echo "PASS: ca-certificates-bundle installed successfully"
        echo "  - ${cert_count} certificates in PEM bundle"
        echo "  - ${hash_count} directory-hash entries in /etc/pki/tls/certs"
      '

main-package-has-update-ca-trust:
  summary: Verify main ca-certificates package ships update-ca-trust
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates" ]]; then
      echo "Skipping: Only applies to ca-certificates (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")

    if ! echo "${files}" | grep -qFx "/usr/bin/update-ca-trust"; then
      TEST_FAIL "ca-certificates should ship /usr/bin/update-ca-trust"
    fi

    if ! echo "${files}" | grep -qFx "/usr/bin/ca-legacy"; then
      TEST_FAIL "ca-certificates should ship /usr/bin/ca-legacy"
    fi

    echo "PASS: ca-certificates ships update-ca-trust and ca-legacy"

gnutls-excludes-bundle:
  summary: Verify gnutls pulls p11-kit-trust which prevents bundle from being installed
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    trap 'rm -rf "${build_dir}"' EXIT
    mkdir -p "${build_dir}/local-repo"

    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi

    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/builder:latest createrepo_c /repo

    repo_root=$(git rev-parse --show-toplevel)

    "${TEST_ENGINE}" run --rm --cap-add=ALL \
      -v "${repo_root}/ci/repos:/tmp/repos:ro,z" \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/builder:latest-hatchling \
      bash -c '
        set -e
        NEWROOT=/new-root-fs

        cp /tmp/repos/*.repo /etc/yum.repos.d/
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo

        DNF="dnf-installroot ${NEWROOT} -y --use-host-config --nodocs --setopt=install_weak_deps=False"

        mkdir -p "${NEWROOT}"
        rpmkeys --import /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-43-primary --root "${NEWROOT}"

        ${DNF} install filesystem

        # Install gnutls — it hard-requires p11-kit-trust, which conflicts
        # with ca-certificates-bundle. Verify gnutls pulls in p11-kit-trust
        # and that the bundle cannot coexist.
        ${DNF} install gnutls

        # Verify p11-kit-trust IS installed (hard-required by gnutls)
        if ! rpm --root="${NEWROOT}" -q p11-kit-trust; then
          echo "FAIL: p11-kit-trust not installed (gnutls should pull it in)"
          exit 1
        fi

        # Verify ca-certificates-bundle is NOT installed (conflicts with p11-kit-trust)
        if rpm --root="${NEWROOT}" -q ca-certificates-bundle 2>/dev/null; then
          echo "FAIL: ca-certificates-bundle should not be installed alongside p11-kit-trust"
          exit 1
        fi

        # Now verify the reverse: try to install the bundle alongside gnutls.
        # This must fail because ca-certificates-bundle conflicts with p11-kit-trust.
        if ${DNF} install ca-certificates-bundle 2>/dev/null; then
          echo "FAIL: installing ca-certificates-bundle alongside gnutls should fail"
          exit 1
        fi

        echo "PASS: gnutls correctly excludes ca-certificates-bundle via p11-kit-trust conflict"
      '

bundle-tls-trust-verification:
  summary: Verify the PEM bundle is usable as a trust store (offline, no network)
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: Only applies to ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    # Extract the RPM contents to inspect the bundle offline
    extract_dir=$(mktemp -d)
    trap 'rm -rf "${extract_dir}"' EXIT

    rpm2cpio "${TEST_RPM}" | (cd "${extract_dir}" && cpio -idm 2>/dev/null)

    bundle="${extract_dir}/usr/share/pki/ca-certificates-bundle/extracted/pem/tls-ca-bundle.pem"

    if [[ ! -s "${bundle}" ]]; then
      TEST_FAIL "tls-ca-bundle.pem is empty or missing"
    fi

    # 1. Extract the first root CA cert from the bundle into a standalone file
    first_cert="${extract_dir}/first-root-ca.pem"
    awk '/-----BEGIN CERTIFICATE-----/{found=1} found{print} /-----END CERTIFICATE-----/{if(found) exit}' \
      "${bundle}" > "${first_cert}"

    if [[ ! -s "${first_cert}" ]]; then
      TEST_FAIL "Could not extract a certificate from the bundle"
    fi

    cert_subject=$(openssl x509 -in "${first_cert}" -noout -subject 2>/dev/null)
    echo "Extracted root CA: ${cert_subject}"

    # 2. Positive test: verify the root CA validates against the bundle
    #    (root CAs are self-signed, so they should verify against a CAfile
    #    that contains them)
    if ! openssl verify -CAfile "${bundle}" "${first_cert}" 2>&1; then
      TEST_FAIL "openssl verify failed: a root CA from the bundle should verify against the bundle"
    fi
    echo "  Positive test passed: root CA verifies against the bundle"

    # 3. Negative test: create a self-signed cert NOT in the bundle and
    #    verify it does NOT validate. This proves the trust store is actually
    #    being used for verification, not just blindly accepting everything.
    untrusted_cert="${extract_dir}/untrusted.pem"
    untrusted_key="${extract_dir}/untrusted.key"
    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
      -keyout "${untrusted_key}" -out "${untrusted_cert}" \
      -days 1 -nodes -subj "/CN=untrusted-test-cert" 2>/dev/null

    if openssl verify -CAfile "${bundle}" "${untrusted_cert}" 2>/dev/null; then
      TEST_FAIL "openssl verify should REJECT an untrusted self-signed cert"
    fi
    echo "  Negative test passed: untrusted cert correctly rejected"

    # 4. Verify the directory-hash certs work with openssl CApath
    hash_dir="${extract_dir}/usr/share/pki/ca-certificates-bundle/extracted/pem/directory-hash"
    hash_count=$(find "${hash_dir}" -maxdepth 1 -name '????????.?' | wc -l)

    if [[ "${hash_count}" -eq 0 ]]; then
      TEST_FAIL "No hash-linked certs found in directory-hash"
    fi

    if ! openssl verify -CApath "${hash_dir}" "${first_cert}" 2>&1; then
      TEST_FAIL "openssl verify -CApath failed: root CA should verify via directory-hash"
    fi
    echo "  CApath test passed: root CA verifies via directory-hash (${hash_count} hash entries)"

    echo "PASS: bundle TLS trust verification succeeded (offline)"
