---
# Tests for the ca-certificates-bundle subpackage

bundle-provides-ca-certificates:
  command: |
    # Verify the bundle RPM advertises Provides: ca-certificates so that
    # packages with Requires: ca-certificates are satisfied by the bundle.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: only runs on ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    provides=$(rpm -qp --provides "${TEST_RPM}")
    if ! echo "${provides}" | grep -qE '^ca-certificates( |$)'; then
      TEST_FAIL "ca-certificates-bundle does not Provide ca-certificates"
    fi
    echo "PASS: bundle provides ca-certificates"

bundle-conflicts:
  command: |
    # Verify the bundle conflicts with ca-certificates so both packages
    # cannot be installed simultaneously.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: only runs on ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    conflicts=$(rpm -qp --conflicts "${TEST_RPM}")

    if ! echo "${conflicts}" | grep -qE '^ca-certificates( |$)'; then
      TEST_FAIL "bundle does not conflict with ca-certificates"
    fi
    echo "PASS: bundle conflicts with ca-certificates"

bundle-no-runtime-deps:
  command: |
    # The bundle must have zero runtime dependencies beyond rpmlib() auto-deps.
    # This is the whole point: no p11-kit, bash, grep, sed, coreutils, findutils.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: only runs on ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    non_rpmlib_deps=$(rpm -qRp "${TEST_RPM}" | grep -v '^rpmlib(' || true)
    if [[ -n "${non_rpmlib_deps}" ]]; then
      TEST_FAIL "bundle has unexpected runtime dependencies: ${non_rpmlib_deps}"
    fi
    echo "PASS: bundle has no runtime dependencies beyond rpmlib()"

bundle-install-standalone:
  command: |
    # Install ca-certificates-bundle into a minimal rootfs and verify it
    # does NOT pull in the heavy dependencies that the full package requires.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: only runs on ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    trap 'rm -rf "${build_dir}"' EXIT
    mkdir -p "${build_dir}/local-repo"

    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi

    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/builder:latest createrepo_c /repo

    repo_root=$(git rev-parse --show-toplevel)

    "${TEST_ENGINE}" run --rm --cap-add=ALL \
      -v "${repo_root}/ci/repos:/tmp/repos:ro,z" \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/builder:latest \
      bash -c '
        set -e
        NEWROOT=/new-root-fs

        cp /tmp/repos/*.repo /etc/yum.repos.d/
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo

        DNF="dnf-installroot ${NEWROOT} -y --use-host-config --nodocs --setopt=install_weak_deps=False"

        mkdir -p "${NEWROOT}"
        rpmkeys --import /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-43-primary --root "${NEWROOT}"

        ${DNF} install filesystem
        ${DNF} install ca-certificates-bundle

        echo "=== Installed packages ==="
        rpm --root="${NEWROOT}" -qa | sort

        for pkg in p11-kit bash grep sed coreutils findutils; do
          if rpm --root="${NEWROOT}" -q "${pkg}" &>/dev/null; then
            echo "FAIL: ${pkg} was pulled in as a dependency"
            exit 1
          fi
        done
        echo "PASS: no heavy dependencies installed"
      '

bundle-cert-bundles:
  command: |
    # Verify the PEM bundles exist, symlinks resolve, and contain certificates.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: only runs on ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    trap 'rm -rf "${build_dir}"' EXIT
    mkdir -p "${build_dir}/local-repo"

    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi

    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/builder:latest createrepo_c /repo

    repo_root=$(git rev-parse --show-toplevel)

    "${TEST_ENGINE}" run --rm --cap-add=ALL \
      -v "${repo_root}/ci/repos:/tmp/repos:ro,z" \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/builder:latest \
      bash -c '
        set -e
        NEWROOT=/new-root-fs

        cp /tmp/repos/*.repo /etc/yum.repos.d/
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo

        DNF="dnf-installroot ${NEWROOT} -y --use-host-config --nodocs --setopt=install_weak_deps=False"

        mkdir -p "${NEWROOT}"
        rpmkeys --import /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-43-primary --root "${NEWROOT}"

        ${DNF} install filesystem
        ${DNF} install ca-certificates-bundle

        echo "=== Test: PEM bundles contain certificates ==="
        for bundle in \
          /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem \
          /etc/pki/ca-trust/extracted/pem/email-ca-bundle.pem \
          /etc/pki/ca-trust/extracted/pem/objsign-ca-bundle.pem; do

          path="${NEWROOT}${bundle}"

          if [ ! -f "${path}" ]; then
            echo "FAIL: ${bundle} does not exist as a regular file"
            exit 1
          fi

          count=$(grep -c "BEGIN CERTIFICATE" "${path}" || true)
          if [ "${count}" -eq 0 ]; then
            echo "FAIL: ${bundle} contains no certificates"
            exit 1
          fi
          echo "PASS: ${bundle} (${count} certs)"
        done

        echo ""
        echo "=== Test: compatibility symlinks resolve ==="
        for link in \
          /etc/pki/tls/cert.pem \
          /etc/pki/tls/certs/ca-bundle.crt \
          /etc/pki/tls/certs/ca-certificates.crt \
          /etc/ssl/cert.pem; do

          path="${NEWROOT}${link}"
          if [ ! -L "${path}" ]; then
            echo "FAIL: ${link} is not a symlink"
            exit 1
          fi

          cur=$(chroot "${NEWROOT}" readlink -f "${link}" 2>/dev/null || true)
          if [ -z "${cur}" ] || [ ! -f "${NEWROOT}${cur}" ]; then
            echo "FAIL: ${link} does not resolve to a file"
            exit 1
          fi
          echo "PASS: ${link} -> $(readlink "${path}")"
        done

        echo ""
        echo "=== Test: directory-hash contains cert hashes ==="
        hash_dir="${NEWROOT}/etc/pki/ca-trust/extracted/pem/directory-hash"
        hash_count=$(find "${hash_dir}" -maxdepth 1 -name "[0-9a-f]*.[0-9]*" | wc -l)
        if [ "${hash_count}" -eq 0 ]; then
          echo "FAIL: no hash entries in directory-hash"
          exit 1
        fi
        echo "PASS: directory-hash has ${hash_count} entries"

        echo ""
        echo "SUCCESS: all bundle content tests passed"
      '

bundle-curl-tls:
  command: |
    # End-to-end TLS verification: install the bundle and curl, then make
    # an HTTPS request. This proves the certificate chain works in practice.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: only runs on ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    trap 'rm -rf "${build_dir}"' EXIT
    mkdir -p "${build_dir}/local-repo"

    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi

    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/builder:latest createrepo_c /repo

    repo_root=$(git rev-parse --show-toplevel)

    "${TEST_ENGINE}" run --rm --cap-add=ALL \
      -v "${repo_root}/ci/repos:/tmp/repos:ro,z" \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/builder:latest \
      bash -c '
        set -e
        NEWROOT=/new-root-fs

        cp /tmp/repos/*.repo /etc/yum.repos.d/
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo

        DNF="dnf-installroot ${NEWROOT} -y --use-host-config --nodocs --setopt=install_weak_deps=False"

        mkdir -p "${NEWROOT}"
        rpmkeys --import /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-43-primary --root "${NEWROOT}"

        ${DNF} install filesystem
        ${DNF} install ca-certificates-bundle curl

        # Set up DNS resolution inside the chroot
        cp /etc/resolv.conf "${NEWROOT}/etc/resolv.conf"

        echo "=== Test: HTTPS request with ca-certificates-bundle ==="
        chroot "${NEWROOT}" curl -fsSL --max-time 15 -o /dev/null \
          -w "HTTP %{http_code} from %{url}\n" \
          https://www.google.com || {
            echo "SKIP: network unavailable (air-gapped environment?)"
            exit 0
          }

        echo "PASS: TLS connection succeeded with ca-certificates-bundle"
      '

bundle-openssl-tls:
  command: |
    # Verify that openssl (which Requires: ca-certificates) can establish
    # a TLS connection using only ca-certificates-bundle.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: only runs on ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    trap 'rm -rf "${build_dir}"' EXIT
    mkdir -p "${build_dir}/local-repo"

    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi

    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/builder:latest createrepo_c /repo

    repo_root=$(git rev-parse --show-toplevel)

    "${TEST_ENGINE}" run --rm --cap-add=ALL \
      -v "${repo_root}/ci/repos:/tmp/repos:ro,z" \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/builder:latest \
      bash -c '
        set -e
        NEWROOT=/new-root-fs

        cp /tmp/repos/*.repo /etc/yum.repos.d/
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo

        DNF="dnf-installroot ${NEWROOT} -y --use-host-config --nodocs --setopt=install_weak_deps=False"

        mkdir -p "${NEWROOT}"
        rpmkeys --import /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-43-primary --root "${NEWROOT}"

        ${DNF} install filesystem
        ${DNF} install ca-certificates-bundle openssl

        cp /etc/resolv.conf "${NEWROOT}/etc/resolv.conf"

        echo "=== Test: openssl s_client with ca-certificates-bundle ==="
        result=$(echo | timeout 15 chroot "${NEWROOT}" openssl s_client \
          -connect www.google.com:443 -verify_return_error 2>&1) || true

        if echo "${result}" | grep -q "Verify return code: 0"; then
          echo "PASS: openssl verified certificate chain successfully"
        elif echo "${result}" | grep -qE "connect:|resolve"; then
          echo "SKIP: network unavailable (air-gapped environment?)"
          exit 0
        else
          code=$(echo "${result}" | grep "Verify return code:" || echo "not found")
          echo "FAIL: openssl verification failed: ${code}"
          exit 1
        fi

        echo ""
        echo "=== Test: ca-certificates-bundle satisfies openssl dependency ==="
        rpm --root="${NEWROOT}" -q ca-certificates-bundle
        if rpm --root="${NEWROOT}" -q ca-certificates 2>/dev/null; then
          echo "FAIL: full ca-certificates package was installed instead of bundle"
          exit 1
        fi
        echo "PASS: openssl is using ca-certificates-bundle"
      '

bundle-python-tls:
  command: |
    # Verify that Python's ssl module and urllib can make HTTPS connections
    # using only ca-certificates-bundle. python-certifi, python-pip, and
    # python-urllib3 all Require: ca-certificates.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ca-certificates-bundle" ]]; then
      echo "Skipping: only runs on ca-certificates-bundle (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    trap 'rm -rf "${build_dir}"' EXIT
    mkdir -p "${build_dir}/local-repo"

    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi

    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/builder:latest createrepo_c /repo

    repo_root=$(git rev-parse --show-toplevel)

    "${TEST_ENGINE}" run --rm --cap-add=ALL \
      -v "${repo_root}/ci/repos:/tmp/repos:ro,z" \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/builder:latest \
      bash -c '
        set -e
        NEWROOT=/new-root-fs

        cp /tmp/repos/*.repo /etc/yum.repos.d/
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo

        DNF="dnf-installroot ${NEWROOT} -y --use-host-config --nodocs --setopt=install_weak_deps=False"

        mkdir -p "${NEWROOT}"
        rpmkeys --import /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-43-primary --root "${NEWROOT}"

        ${DNF} install filesystem
        ${DNF} install ca-certificates-bundle python3

        cp /etc/resolv.conf "${NEWROOT}/etc/resolv.conf"

        echo "=== Test: Python ssl module finds CA bundle ==="
        printf "import ssl\nctx = ssl.create_default_context()\nstats = ctx.cert_store_stats()\nca = stats[\"x509_ca\"]\nassert ca > 0, \"No CA certs: \" + str(stats)\nprint(\"PASS: ssl module loaded %%d CA certificates\" %% ca)\n" \
          > "${NEWROOT}/tmp/test_ssl.py"
        chroot "${NEWROOT}" python3 /tmp/test_ssl.py

        echo ""
        echo "=== Test: Python urllib HTTPS request ==="
        printf "import socket, urllib.request\nsocket.setdefaulttimeout(15)\ntry:\n    resp = urllib.request.urlopen(\"https://www.google.com\")\n    assert resp.status == 200\n    print(\"PASS: Python urllib HTTPS request succeeded\")\nexcept OSError as e:\n    print(\"SKIP: network unavailable: \" + str(e))\n" \
          > "${NEWROOT}/tmp/test_urllib.py"
        chroot "${NEWROOT}" python3 /tmp/test_urllib.py
      '
