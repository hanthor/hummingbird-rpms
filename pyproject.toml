[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hum"
version = "0.1.0"
description = "Hummingbird metadata library"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[tool.hatch.build.targets.wheel]
packages = ["hum"]

[dependency-groups]
dev = [
  "rhjira",
]

[[tool.mypy.overrides]]
module = [
  "cki_lib.*",
  "cve_analysis_bridge",
  "hummingbird_cve_analysis.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
# Keep the existing lint policy explicit as Ruff defaults change.
select = ["E4", "E7", "E9", "F"]
