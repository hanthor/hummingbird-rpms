changes:
- description: Rename package from golang to golang-fips1.25, enable FIPS on Hummingbird,
    add Provides, fix paths, and handle .syso files
  patches:
  - 01-rename-to-golang-fips-with-fips-enabled.patch
- description: Exclude the go-toolset meta-package on Hummingbird builds since it
    conflicts with versioned Go packaging
  patches:
  - 02-exclude-go-toolset-meta-package.patch
- description: Rebase go.env defaults patch to remove GOAMD64=v3 (not needed on Hummingbird)
    while keeping GOTOOLCHAIN=local and GOPPC64=power9
  files:
  - 0001-Modify-go.env.patch
- description: Skip TestTerminalSignal test that hangs in podman containers with --init
    as used by mock for RPM builds
  patches:
  - 04-skip-test-terminal-signal.patch
  files:
  - 0010-Skip-TestTerminalSignal.patch
