nodejs20-lts:
  private_product: nodejs20
  lookaside_cache_url: *private_lookaside_cache_url
  # Needed once redhat/hummingbird/pipelines/rpmbuild-pipeline!28 lands: that
  # MR makes process-sources's dist-git-client call unconditional (it no
  # longer special-cases lookaside_cache_url at all), so it needs
  # forked_from to resolve mock/dist-git-client.ini's [hummingbird] section
