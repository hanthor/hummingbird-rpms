---
# Default tests for all default (runtime) rpms
# These are minimal tests that should pass for all rpms
rpm-integrity-check:
  environment:
    base: quay.io/hummingbird/core-runtime:latest-builder
  command: |
    # Find all binary RPMs for the package being tested
    mapfile -t TEST_RPMS < <(find "${TEST_RPMS_DIR:?}" -maxdepth 1 -name "${PACKAGE_NAME:?}-[0-9]*.rpm" ! -name "*.src.rpm" -type f | sort)
    if [[ ${#TEST_RPMS[@]} -eq 0 ]]; then
      echo "Error: No binary RPMs found for package ${PACKAGE_NAME}"
      exit 1
    fi

    echo "Checking ${#TEST_RPMS[@]} RPM(s) for ${PACKAGE_NAME}:"
    for rpm_file in "${TEST_RPMS[@]}"; do
      echo "=== Checking $(basename "${rpm_file}") ==="
      rpm -K "${rpm_file}"
      rpm -qip "${rpm_file}"
      rpm -qlp "${rpm_file}"
      rpm -qRp "${rpm_file}"
      echo ""
    done

rpmlint:
  environment:
    base: quay.io/hummingbird/core-runtime:latest-builder
    packages:
      remote:
        - rpmlint
  command: |
    # Find all binary RPMs for the package being tested
    mapfile -t TEST_RPMS < <(find "${TEST_RPMS_DIR:?}" -maxdepth 1 -name "${PACKAGE_NAME:?}-[0-9]*.rpm" ! -name "*.src.rpm" -type f | sort)
    if [[ ${#TEST_RPMS[@]} -eq 0 ]]; then
      echo "Error: No binary RPMs found for package ${PACKAGE_NAME}"
      exit 1
    fi

    echo "Running rpmlint on ${#TEST_RPMS[@]} RPM(s) for ${PACKAGE_NAME}:"
    # Run rpmlint on all RPMs at once for better output
    rpmlint "${TEST_RPMS[@]}"

rpm-install:
  environment:
    base: quay.io/hummingbird/core-runtime:latest-builder
  command: |
    # Find the binary RPM for the package being tested
    TEST_RPM=$(find "${TEST_RPMS_DIR:?}" -maxdepth 1 -name "${PACKAGE_NAME:?}-[0-9]*.rpm" ! -name "*.src.rpm" -type f | head -n1)
    if [[ -z ${TEST_RPM} ]]; then
      echo "Error: No binary RPM found for package ${PACKAGE_NAME}"
      exit 1
    fi

    # Install the package from local repository
    dnf install -y --from-repo=local-repo "${PACKAGE_NAME}"

    # Verify installation succeeded
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    rpm -q "${rpm_name}"

# Source RPM tests (only run when --src-rpm is provided)
src-rpm-integrity-check:
  environment:
    base: quay.io/hummingbird/core-runtime:latest-builder
  command: |
    # Find the source RPM for the package being tested
    # Look in TEST_SRC_RPMS_DIR first, then fall back to TEST_RPMS_DIR
    search_dir="${TEST_SRC_RPMS_DIR:-${TEST_RPMS_DIR}}"
    TEST_SRC_RPM=$(find "${search_dir:?}" -maxdepth 1 -name "${PACKAGE_NAME:?}-[0-9]*.src.rpm" -type f | head -n1)
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM found for package ${PACKAGE_NAME}"
      exit 0
    fi

    # Check source RPM signature and metadata
    rpm -K "${TEST_SRC_RPM}"
    rpm -qip "${TEST_SRC_RPM}"
    rpm -qlp "${TEST_SRC_RPM}"

src-rpmlint:
  environment:
    base: quay.io/hummingbird/core-runtime:latest-builder
    packages:
      remote:
        - rpmlint
  command: |
    # Find the source RPM for the package being tested
    # Look in TEST_SRC_RPMS_DIR first, then fall back to TEST_RPMS_DIR
    search_dir="${TEST_SRC_RPMS_DIR:-${TEST_RPMS_DIR}}"
    TEST_SRC_RPM=$(find "${search_dir:?}" -maxdepth 1 -name "${PACKAGE_NAME:?}-[0-9]*.src.rpm" -type f | head -n1)
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM found for package ${PACKAGE_NAME}"
      exit 0
    fi

    # Run rpmlint on source RPM
    rpmlint "${TEST_SRC_RPM}"

src-rpm-rebuild:
  environment:
    base: quay.io/hummingbird/core-runtime:latest-builder
    packages:
      remote:
        - rpm-build
        - dnf-plugins-core
  command: |
    # Find the source RPM for the package being tested
    # Look in TEST_SRC_RPMS_DIR first, then fall back to TEST_RPMS_DIR
    search_dir="${TEST_SRC_RPMS_DIR:-${TEST_RPMS_DIR}}"
    TEST_SRC_RPM=$(find "${search_dir:?}" -maxdepth 1 -name "${PACKAGE_NAME:?}-[0-9]*.src.rpm" -type f | head -n1)
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM found for package ${PACKAGE_NAME}"
      exit 0
    fi

    # Install the source RPM
    rpm -i "${TEST_SRC_RPM}"

    # Find the spec file
    spec_file=$(find /root/rpmbuild/SPECS -name "*.spec" -type f | head -n1)

    if [[ -z ${spec_file} ]]; then
      echo "Error: No spec file found in /root/rpmbuild/SPECS/"
      ls -la /root/rpmbuild/SPECS/ || true
      exit 1
    fi

    echo "Found spec file: ${spec_file}"

    # Install build dependencies for the package
    dnf builddep -y "${TEST_SRC_RPM}"

    # Try to rebuild the package
    rpmbuild -bb --define "_topdir /root/rpmbuild" "${spec_file}"

    # Verify RPMs were built
    find /root/rpmbuild/RPMS/ -name "*.rpm" -type f
