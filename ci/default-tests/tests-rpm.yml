---
# Default tests for all default (runtime) rpms
# These are minimal tests that should pass for all rpms
rpm-integrity-check:
  command: |
    rpm -K "${TEST_RPM:?}"
    rpm -qip "${TEST_RPM:?}"
    rpm -qlp "${TEST_RPM:?}"
    rpm -qRp "${TEST_RPM:?}"

rpmlint:
  command: |
    rpmlint "${TEST_RPM:?}"

rpm-install:
  environment:
    base: quay.io/hummingbird/core-runtime:latest-builder
    packages:
      - rpm  # Install from local repo
  command: |
    # Test installing the RPM in a container
    # Verify installation succeeded
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    rpm -q "${rpm_name}"

# Source RPM tests (only run when --src-rpm is provided)
src-rpm-integrity-check:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Check source RPM signature and metadata
    rpm -K "${TEST_SRC_RPM}"
    rpm -qip "${TEST_SRC_RPM}"
    rpm -qlp "${TEST_SRC_RPM}"

src-rpmlint:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Run rpmlint on source RPM
    rpmlint "${TEST_SRC_RPM}"

src-rpm-rebuild:
  environment:
    base: quay.io/hummingbird/core-runtime:latest-builder
    packages:
      - rpm-build
      - dnf-plugins-core
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Install the source RPM
    rpm -i "${TEST_SRC_RPM}"

    # Find the spec file
    spec_file=$(find /root/rpmbuild/SPECS -name "*.spec" -type f | head -n1)

    if [[ -z ${spec_file} ]]; then
      echo "Error: No spec file found in /root/rpmbuild/SPECS/"
      ls -la /root/rpmbuild/SPECS/ || true
      exit 1
    fi

    echo "Found spec file: ${spec_file}"

    # Install build dependencies for the package
    dnf builddep -y "${TEST_SRC_RPM}"

    # Try to rebuild the package
    rpmbuild -bb --define "_topdir /root/rpmbuild" "${spec_file}"

    # Verify RPMs were built
    find /root/rpmbuild/RPMS/ -name "*.rpm" -type f
