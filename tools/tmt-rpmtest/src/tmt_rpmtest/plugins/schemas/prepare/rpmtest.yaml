$id: /schemas/prepare/rpmtest
$schema: https://json-schema.org/draft-07/schema
type: object
additionalProperties: false
properties:
  how: {const: rpmtest}
  name: {type: string}
  order: {type: integer}
  where:
    $ref: /schemas/common#/definitions/where
  when:
    $ref: /schemas/common#/definitions/when
  packages:
    type: array
    minItems: 1
    items: {type: string}
  repositories:
    type: array
    items: {type: string}
  artifacts:
    type: array
    items: {type: string}
  builder:
    type: string
    pattern: '^\S+@sha256:[0-9a-f]{64}$'
  python: {type: string}
  cpus: {type: number, exclusiveMinimum: 0}
  memory: {type: integer, minimum: 1}
  pids: {type: integer, minimum: 1}
required: [how, packages]
